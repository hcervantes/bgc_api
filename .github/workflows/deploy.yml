name: Deploy (production)

# Stage 2 of the BGC CI/CD plan (Documenation/cicd_plan.md in bgc_project).
# Manual dispatch ONLY (decided): builds the chosen ref, pushes a SHA-tagged image to the
# DO registry, then SSHes to the bgc-portal droplet which runs migrate-first + compose up.
# Version numbers live in GitHub Release notes, not the image tag (decided Nov 4).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build and deploy (default: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: oauth2
          password: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN }}

      - name: Build and push
        id: build
        run: |
          IMAGE=registry.digitalocean.com/bgc-registry/api
          TAG=sha-$(git rev-parse --short HEAD)
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Deploy to droplet (migrate first, then compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_SSH_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # deploy.sh: docker pull -> prisma migrate deploy -> compose up -d -> health checks.
          # It fails non-zero, which fails this job. Keep SSH restricted to this forced command.
          script: /srv/bgc/deploy.sh api ${{ needs.build-push.outputs.tag }}

      - name: Verify API health
        run: |
          sleep 5
          curl -fsS https://api.mybgctax.com/v1/health \
            || (echo "API HEALTH CHECK FAILED AFTER DEPLOY"; exit 1)
