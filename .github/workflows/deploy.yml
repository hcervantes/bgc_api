name: Deploy (production)

# Stage 2 of the BGC CI/CD plan (Documenation/cicd_plan.md in bgc_project).
# Manual dispatch ONLY (decided). build-push runs on a GitHub-hosted runner;
# the deploy job runs ON the droplet via the self-hosted runner labeled
# 'bgc-droplet' (Option B: no inbound SSH from GitHub, port 22 stays
# home-IP-only). Version numbers live in GitHub Release notes (decided Nov 4).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build and deploy (default: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: oauth2
          password: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN }}

      - name: Build and push
        id: build
        run: |
          IMAGE=registry.digitalocean.com/bgc-registry/api
          TAG=sha-$(git rev-parse --short HEAD)

          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    # Self-hosted runner installed on the bgc-portal droplet (label: bgc-droplet).
    # Requires sudoers entry (droplet, visudo):
    #   gh-runner ALL=(root) NOPASSWD: /srv/bgc/deploy.sh
    runs-on: bgc-droplet
    needs: build-push
    environment: production
    steps:
      - name: Deploy (pull -> migrate first -> compose up -> health checks)
        run: sudo /srv/bgc/deploy.sh api ${{ needs.build-push.outputs.tag }}

      - name: Verify api health
        run: |
          sleep 5
          curl -fsS https://api.mybgctax.com/v1/health || { echo "API HEALTH CHECK FAILED AFTER DEPLOY"; exit 1; }
