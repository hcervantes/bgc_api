name: CI

# Stage 1 of the BGC CI/CD plan (Documenation/cicd_plan.md in bgc_project).
# Gates every PR to develop: install -> prisma generate -> tsc --noEmit -> build -> docker build (no push).
# No test suite yet; wire `npm test` in when one lands.

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Stale-dist lesson: always know the typecheck state before any build
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (nest)
        run: npm run build

      # Dockerfile + healthcheck landed in PR #9; keep proving it builds on every PR
      - name: Docker build (no push)
        run: docker build -t bgc-api-ci .
