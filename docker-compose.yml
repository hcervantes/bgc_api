services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bgc
      POSTGRES_PASSWORD: bgc
      POSTGRES_DB: bgc
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # NOTE: no clamav service here. The bgc-api app runs on the WSL host in
  # dev and shares the PORTAL stack's clamd (bgc-portal-clamd) at
  # localhost:3310 — one scanner for both stacks, mirroring prod where the
  # app dials the single clamd container via CLAMD_HOST. (The API stack's
  # own clamav used to collide on host port 3310 with the portal's.)

  minio: # local stand-in for DO Spaces
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spaceskey
      MINIO_ROOT_PASSWORD: spacessecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
