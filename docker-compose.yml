services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bgc
      POSTGRES_PASSWORD: bgc
      POSTGRES_DB: bgc
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  clamav:
    image: clamav/clamav:latest
    ports: ["3310:3310"]

  minio: # local stand-in for DO Spaces
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spaceskey
      MINIO_ROOT_PASSWORD: spacessecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
